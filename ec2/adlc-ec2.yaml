  LabEvalLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "adlc-${LabSuffix}-eval-lambda-role-${AWS::Region}"
      Description: "adlc evaluator Lambda execution role (pre-created by the lab stack)"
      PermissionsBoundary: !Ref LabRoleBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: "sts:AssumeRole"}
      Policies:
        - PolicyName: !Sub "adlc-${LabSuffix}-eval-lambda-role-${AWS::Region}-inline"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"], Resource: !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/adlc-${LabSuffix}-*"}
              - {Effect: Allow, Action: ["bedrock:InvokeModel", "bedrock:InvokeModelWithResponseStream"], Resource: [!Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-5-5", !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-5-5", !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-2-lite-v1:0", !Sub "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-5-5", !Sub "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/anthropic.claude-haiku-5-5", !Sub "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/amazon.nova-2-lite-v1:0", !Sub "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-5-5", !Sub "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/anthropic.claude-haiku-5-5", !Sub "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/amazon.nova-2-lite-v1:0", !Sub "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-5-5", !Sub "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/anthropic.claude-haiku-5-5", !Sub "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/amazon.nova-2-lite-v1:0"]}
      Tags: [{Key: "adlc:lab", Value: agentdlc}, {Key: "adlc:owner", Value: !Ref LabSuffix}, {Key: "adlc:managed-by", Value: cloudformation}]

  LabOnlineEvalRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "adlc-${LabSuffix}-online-eval-role-${AWS::Region}"
      Description: "adlc AgentCore online-evaluation execution role (pre-created by the lab stack)"
      PermissionsBoundary: !Ref LabRoleBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: bedrock-agentcore.amazonaws.com}, Action: "sts:AssumeRole", Condition: {StringEquals: {"aws:SourceAccount": !Sub "${AWS::AccountId}", "aws:ResourceAccount": !Sub "${AWS::AccountId}"}, ArnLike: {"aws:SourceArn": [!Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:evaluator/*", !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:online-evaluation-config/*"]}}}
      Policies:
        - PolicyName: !Sub "adlc-${LabSuffix}-online-eval-role-${AWS::Region}-inline"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: ["logs:DescribeLogGroups", "logs:GetQueryResults", "logs:StartQuery", "logs:StopQuery", "logs:FilterLogEvents", "logs:GetLogEvents", "logs:DescribeLogStreams", "logs:DescribeIndexPolicies", "logs:DescribeFieldIndexes"], Resource: "*"}
              - {Effect: Allow, Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"], Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/evaluations/*"}
              - {Effect: Allow, Action: ["logs:PutIndexPolicy"], Resource: [!Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws/spans", !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws/spans:*", !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*"]}
              - {Effect: Allow, Action: ["bedrock:InvokeModel", "bedrock:InvokeModelWithResponseStream"], Resource: [!Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-5-5", !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-5-5", !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-2-lite-v1:0", !Sub "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-5-5", !Sub "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/anthropic.claude-haiku-5-5", !Sub "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/amazon.nova-2-lite-v1:0", !Sub "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-5-5", !Sub "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/anthropic.claude-haiku-5-5", !Sub "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/amazon.nova-2-lite-v1:0", !Sub "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-5-5", !Sub "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/anthropic.claude-haiku-5-5", !Sub "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/amazon.nova-2-lite-v1:0"]}
              - {Effect: Allow, Action: ["lambda:InvokeFunction", "lambda:GetFunction"], Resource: [!Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:adlc-${LabSuffix}-eval-*"]}
              - {Effect: Allow, Action: ["cloudwatch:PutMetricData"], Resource: "*"}
      Tags: [{Key: "adlc:lab", Value: agentdlc}, {Key: "adlc:owner", Value: !Ref LabSuffix}, {Key: "adlc:managed-by", Value: cloudformation}]
  # ---------------------------------------------------------------------------
  # The EC2 instance (no key pair; login via SSM only).
  # ---------------------------------------------------------------------------
  Instance:
    Type: AWS::EC2::Instance
    DependsOn: NetworkReady
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !If [CreateVpc, !Ref PublicSubnet, !Ref SubnetId]
          GroupSet: [!Ref InstanceSecurityGroup]
          # Public IPv4 is only for OUTBOUND traffic (no NAT gateway needed);
          # the security group has no inbound rules.
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      PropagateTagsToVolumeOnCreation: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Minimal OS bootstrap only. The lab repo is cloned manually by the participant.
          set -uo pipefail
          cat > /etc/profile.d/adlc.sh <<'EOF'
          export AWS_REGION=${AWS::Region}
          export AWS_DEFAULT_REGION=${AWS::Region}
          export LAB_SUFFIX=${LabSuffix}
          EOF
          chmod 0644 /etc/profile.d/adlc.sh
          for attempt in 1 2 3 4 5; do
            dnf install -y git jq tar gzip unzip && break
            echo "dnf install failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
      Tags:
        - { Key: Name, Value: !Sub "adlc-${LabSuffix}" }
        - { Key: "adlc:lab", Value: agentdlc }
        - { Key: "adlc:owner", Value: !Ref LabSuffix }

Outputs:
  InstanceId:
    Description: EC2 instance id
    Value: !Ref Instance
  SessionManagerUrl:
    Description: Open this URL in the AWS console to get a shell (Session Manager)
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${Instance}?region=${AWS::Region}"
  RoleName:
    Description: Instance role name
    Value: !Ref InstanceRole
