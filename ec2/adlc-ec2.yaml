AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AgentDLC lab - one participant EC2 (Amazon Linux 2023), SSM Session Manager
  only (no inbound ports, no key pair), instance role for Bedrock / AgentCore /
  CloudWatch lab work. Stack name convention: adlc-ec2-<suffix>.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Participant" }
        Parameters: [LabSuffix, InstanceType]
      - Label: { default: "Network (leave empty to create a small dedicated VPC)" }
        Parameters: [VpcId, SubnetId, NewSubnetAz]
      - Label: { default: "Advanced" }
        Parameters: [LatestAmiId]

Parameters:
  LabSuffix:
    Type: String
    Description: Personal suffix, lowercase letters/digits, 2-12 chars, starts with a letter (e.g. zhang3).
    AllowedPattern: "^(?!ec2$)[a-z][a-z0-9]{1,11}$"
    ConstraintDescription: "2-12 chars, lowercase letters/digits, must start with a letter (e.g. zhang3); ec2 is reserved."
  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3.large, t3.xlarge, m7i.large]
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  VpcId:
    Type: String
    Default: ""
    Description: Optional existing VPC (e.g. the default VPC). Set together with SubnetId, or leave both empty.
  SubnetId:
    Type: String
    Default: ""
    Description: >-
      Optional existing subnet with a route to an internet gateway (e.g. a default-VPC subnet).
      Empty = create a minimal VPC (note the default quota of 5 VPCs per Region).
  NewSubnetAz:
    Type: String
    Default: ""
    Description: Only used when a new VPC is created. Empty = first AZ of the Region.

Rules:
  SubnetRequiresVpc:
    RuleCondition: !Not [!Equals [!Ref SubnetId, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref VpcId, ""]]
        AssertDescription: VpcId must be set when SubnetId is set.
  VpcRequiresSubnet:
    RuleCondition: !Not [!Equals [!Ref VpcId, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref SubnetId, ""]]
        AssertDescription: SubnetId must be set when VpcId is set.

Conditions:
  # Both empty -> create a VPC; both set -> use the existing subnet (Rules forbid one without the other).
  CreateVpc: !Or [!Equals [!Ref VpcId, ""], !Equals [!Ref SubnetId, ""]]
  HasNewSubnetAz: !Not [!Equals [!Ref NewSubnetAz, ""]]

Resources:
  # ---------------------------------------------------------------------------
  # Minimal network (only when no SubnetId is given): 1 VPC, 1 public subnet,
  # IGW, route table. Outbound internet is needed for dnf/pip/npm/git and SSM.
  # ---------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Condition: CreateVpc
    Properties:
      CidrBlock: 10.12.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "adlc-${LabSuffix}" }
        - { Key: "adlc:lab", Value: agentdlc }
        - { Key: "adlc:owner", Value: !Ref LabSuffix }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateVpc
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "adlc-${LabSuffix}" }
        - { Key: "adlc:lab", Value: agentdlc }
        - { Key: "adlc:owner", Value: !Ref LabSuffix }

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.12.0.0/24
      AvailabilityZone: !If [HasNewSubnetAz, !Ref NewSubnetAz, !Select [0, !GetAZs ""]]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "adlc-${LabSuffix}-public" }
        - { Key: "adlc:lab", Value: agentdlc }
        - { Key: "adlc:owner", Value: !Ref LabSuffix }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateVpc
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "adlc-${LabSuffix}-public" }
        - { Key: "adlc:lab", Value: agentdlc }
        - { Key: "adlc:owner", Value: !Ref LabSuffix }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateVpc
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # Conditional DependsOn: the instance waits for the internet route only when
  # this stack creates the VPC (DependsOn cannot point at a conditional resource).
  NetworkReady:
    Type: AWS::CloudFormation::WaitConditionHandle
    Metadata:
      DefaultRoute: !If [CreateVpc, !Ref PublicDefaultRoute, !Ref AWS::NoValue]
      SubnetAssociation: !If [CreateVpc, !Ref PublicSubnetRouteTableAssociation, !Ref AWS::NoValue]

  # ---------------------------------------------------------------------------
  # Security group: NO inbound rules at all. Access is via SSM Session Manager
  # (the agent dials out over HTTPS). Egress is open for package installs.
  # ---------------------------------------------------------------------------
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "adlc ${LabSuffix} - no inbound, SSM only"
      VpcId: !If [CreateVpc, !Ref Vpc, !Ref VpcId]
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: All outbound (dnf/pip/npm/git, SSM, AWS APIs)
      Tags:
        - { Key: Name, Value: !Sub "adlc-${LabSuffix}" }
        - { Key: "adlc:lab", Value: agentdlc }
        - { Key: "adlc:owner", Value: !Ref LabSuffix }

  # ---------------------------------------------------------------------------
  # Instance role.
  # INTENTIONALLY BROAD for a 1-day lab in a disposable account (AgentCore, Lambda,
  # S3, observability without friction). IAM: only PassRole of the 3 lab roles and service-linked
  # roles, no other IAM writes. Not for real workloads.
  # ---------------------------------------------------------------------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "adlc-ec2-${LabSuffix}-${AWS::Region}"
      Description: !Sub "AgentDLC lab EC2 role for ${LabSuffix}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: adlc-workshop
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Model allowlist = labkit/models.py (us. profiles + their models in the 3 route Regions;
              # Converse is authorized by InvokeModel*). tests/test_model_allowlist.py keeps copies equal.
              - Sid: BedrockAllowlistedModels
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:CountTokens
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-5-5"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-5-5"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-2-lite-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-5-5"
                  - !Sub "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/anthropic.claude-haiku-5-5"
                  - !Sub "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/amazon.nova-2-lite-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-5-5"
                  - !Sub "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/anthropic.claude-haiku-5-5"
                  - !Sub "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/amazon.nova-2-lite-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-5-5"
                  - !Sub "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/anthropic.claude-haiku-5-5"
                  - !Sub "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/amazon.nova-2-lite-v1:0"
              - Sid: BedrockModelCatalogRead
                Effect: Allow
                Action:
                  - bedrock:ListFoundationModels
                  - bedrock:GetFoundationModel
                  - bedrock:ListInferenceProfiles
                  - bedrock:GetInferenceProfile
                Resource: "*"
              # No long-lived credentials (users, keys, passwords, Bedrock API keys, federation).
              - Sid: DenyCredentialCreation
                Effect: Deny
                Action:
                  - iam:CreateUser
                  - iam:CreateAccessKey
                  - iam:CreateLoginProfile
                  - iam:UpdateLoginProfile
                  - iam:CreateServiceSpecificCredential
                  - iam:ResetServiceSpecificCredential
                  - iam:AttachUserPolicy
                  - iam:PutUserPolicy
                  - iam:UpdateAccessKey
                  - iam:UpdateServiceSpecificCredential
                  - iam:UploadSSHPublicKey
                  - iam:UploadSigningCertificate
                  - iam:AddUserToGroup
                  - iam:PutGroupPolicy
                  - iam:AttachGroupPolicy
                  - iam:CreateOpenIDConnectProvider
                  - iam:CreateSAMLProvider
                  - sts:GetFederationToken
                  - iam:UpdateSSHPublicKey
                  - iam:UpdateSigningCertificate
                  - iam:UpdateSAMLProvider
                  - iam:AddClientIDToOpenIDConnectProvider
                  - iam:UpdateOpenIDConnectProviderThumbprint
                  - iam:PutUserPermissionsBoundary
                  - iam:DeleteUserPermissionsBoundary
                  - rolesanywhere:CreateTrustAnchor
                  - rolesanywhere:CreateProfile
                  - sts:GetSessionToken
                Resource: "*"
              # Marketplace auto-subscribe on first use, only via Bedrock.
              - Sid: BedrockMarketplaceAutoSubscribe
                Effect: Allow
                Action:
                  - aws-marketplace:ViewSubscriptions
                  - aws-marketplace:Subscribe
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:CalledViaLast: bedrock.amazonaws.com
              - Sid: AgentCore
                Effect: Allow
                Action: bedrock-agentcore:*
                Resource: "*"
              # The 3 lab service roles are pre-created below: read them, pass each to its own service.
              - Sid: LabIamReadRoles
                Effect: Allow
                Action: iam:GetRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/adlc-${LabSuffix}-*"
              - Sid: LabIamPassAgentCoreRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt LabRuntimeRole.Arn
                  - !GetAtt LabOnlineEvalRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: bedrock-agentcore.amazonaws.com
              - Sid: LabIamPassLambdaRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt LabEvalLambdaRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: LabIamReadBoundary
                Effect: Allow
                Action: iam:GetPolicy
                Resource: !Ref LabRoleBoundary
              - Sid: ListForCleanup
                Effect: Allow
                Action:
                  - iam:ListRoles
                  - lambda:ListFunctions
                Resource: "*"
              # No IAM role/policy writes (cross-account trust would be a credential outside the lab).
              - Sid: DenyIamRoleWrites
                Effect: Deny
                Action:
                  - iam:CreateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:DeleteRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePermissionsBoundary
                  - iam:DeleteRolePermissionsBoundary
                  - iam:CreateInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:CreatePolicy
                  - iam:CreatePolicyVersion
                  - iam:SetDefaultPolicyVersion
                  - iam:DeletePolicy
                  - iam:DeletePolicyVersion
                Resource: "*"
              # Nothing reachable from outside the account (the lab uses none of these). Residual: a
              # Runtime custom JWT authorizer (no IAM condition key).
              - Sid: DenyPublicExposure
                Effect: Deny
                Action:
                  - lambda:CreateFunctionUrlConfig
                  - lambda:UpdateFunctionUrlConfig
                  - lambda:AddPermission
                  - bedrock-agentcore:PutResourcePolicy
                  - bedrock-agentcore:CreateGateway*
                  - bedrock-agentcore:UpdateGateway*
                  - bedrock-agentcore:CreateHarness*
                  - bedrock-agentcore:UpdateHarness*
                  - s3:PutBucketPolicy
                  - s3:PutBucketAcl
                  - s3:PutObjectAcl
                  - s3:PutObjectVersionAcl
                  - s3:PutBucketOwnershipControls
                  - s3:PutBucketWebsite
                  - s3:DeleteBucketPolicy
                  - logs:PutSubscriptionFilter
                  - logs:PutDestination
                  - logs:PutDestinationPolicy
                  - logs:CreateExportTask
                Resource: "*"
              # Service-linked roles are created on first use.
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                  - iam:GetRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*"
              - Sid: LabLambda
                Effect: Allow
                Action: lambda:*
                Resource: !Sub "arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:adlc-${LabSuffix}-*"
              - Sid: LabS3Buckets
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::adlc-*"
                  - !Sub "arn:${AWS::Partition}:s3:::adlc-*/*"
              - Sid: S3ListBuckets
                Effect: Allow
                Action: s3:ListAllMyBuckets
                Resource: "*"
              - Sid: LabLogGroups
                Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*"
                  - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/adlc-*"
                  - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:aws/spans"
                  - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:aws/spans:*"
                  - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/application-signals/data"
                  - !Sub "arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/application-signals/data:*"
              - Sid: LogsAccountLevel
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeResourcePolicies
                  - logs:PutResourcePolicy
                  # 99-cleanup.sh --all --account-level removes the policy the lab added
                  - logs:DeleteResourcePolicy
                  - logs:StopQuery
                  - logs:GetQueryResults
                  - logs:DescribeQueries
                Resource: "*"
              # logs:StartQuery only on the lab log groups (LabLogGroups).
              - Sid: Observability
                Effect: Allow
                Action:
                  - xray:*
                  - application-signals:*
                  - cloudwatch:PutMetricData
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - observabilityadmin:Get*
                  - observabilityadmin:List*
                Resource: "*"
              - Sid: ReadOnlyHelpers
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                  - ec2:Describe*
                  - cloudformation:Describe*
                  - cloudformation:List*
                Resource: "*"
      Tags:
        - { Key: "adlc:lab", Value: agentdlc }
        - { Key: "adlc:owner", Value: !Ref LabSuffix }

  # Permissions boundary of every lab service role.
  LabRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "adlc-boundary-${LabSuffix}-${AWS::Region}"
      Description: Upper bound for roles created by the adlc scripts
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Same model allowlist as the instance role.
          - Sid: AllowlistedModels
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource:
              - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-5-5"
              - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-5-5"
              - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-2-lite-v1:0"
              - !Sub "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-5-5"
              - !Sub "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/anthropic.claude-haiku-5-5"
              - !Sub "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/amazon.nova-2-lite-v1:0"
              - !Sub "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-5-5"
              - !Sub "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/anthropic.claude-haiku-5-5"
              - !Sub "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/amazon.nova-2-lite-v1:0"
              - !Sub "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-5-5"
              - !Sub "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/anthropic.claude-haiku-5-5"
              - !Sub "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/amazon.nova-2-lite-v1:0"
          - Sid: AgentCoreWorkloadTokens
            Effect: Allow
            Action:
              - bedrock-agentcore:GetWorkloadAccessToken
              - bedrock-agentcore:GetWorkloadAccessTokenForJWT
              - bedrock-agentcore:GetWorkloadAccessTokenForUserId
            Resource: "*"
          # Lab roles are for AWS services only, never a web-identity (OIDC, Cognito) session.
          - Sid: DenyFederatedSessions
            Effect: Deny
            Action: "*"
            Resource: "*"
            Condition:
              "Null":
                aws:FederatedProvider: "false"
          - Sid: DenyCredentialCreation
            Effect: Deny
            Action:
              - iam:CreateUser
              - iam:CreateAccessKey
              - iam:CreateLoginProfile
              - iam:UpdateLoginProfile
              - iam:CreateServiceSpecificCredential
              - iam:ResetServiceSpecificCredential
              - iam:AttachUserPolicy
              - iam:PutUserPolicy
              - iam:UpdateAccessKey
              - iam:UpdateServiceSpecificCredential
              - iam:UploadSSHPublicKey
              - iam:UploadSigningCertificate
              - iam:AddUserToGroup
              - iam:PutGroupPolicy
              - iam:AttachGroupPolicy
              - iam:CreateOpenIDConnectProvider
              - iam:CreateSAMLProvider
              - sts:GetFederationToken
              - iam:UpdateSSHPublicKey
              - iam:UpdateSigningCertificate
              - iam:UpdateSAMLProvider
              - iam:AddClientIDToOpenIDConnectProvider
              - iam:UpdateOpenIDConnectProviderThumbprint
              - iam:PutUserPermissionsBoundary
              - iam:DeleteUserPermissionsBoundary
              - rolesanywhere:CreateTrustAnchor
              - rolesanywhere:CreateProfile
              - sts:GetSessionToken
            Resource: "*"
          - Sid: Telemetry
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
              - logs:PutResourcePolicy
              - logs:StartQuery
              - logs:StopQuery
              - logs:GetQueryResults
              - logs:FilterLogEvents
              - logs:GetLogEvents
              - logs:DescribeIndexPolicies
              - logs:DescribeFieldIndexes
              - logs:PutIndexPolicy
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
              - cloudwatch:PutMetricData
            Resource: "*"
          - Sid: InvokeLabEvaluators
            Effect: Allow
            Action:
              - lambda:InvokeFunction
              - lambda:GetFunction
            Resource: !Sub "arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:adlc-${LabSuffix}-*"
          - Sid: ReadLabBuckets
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::adlc-*/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "adlc-ec2-${LabSuffix}-${AWS::Region}"
      Roles: [!Ref InstanceRole]

  # The 3 lab service roles with fixed service-only trust; equal to what labkit builds (checked by
  # tests/test_model_allowlist.py). labkit uses them as is; 99-cleanup.sh leaves them to the stack.
  LabRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "adlc-${LabSuffix}-runtime-role-${AWS::Region}"
      Description: "adlc AgentCore Runtime execution role (pre-created by the lab stack)"
      PermissionsBoundary: !Ref LabRoleBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: bedrock-agentcore.amazonaws.com}, Action: "sts:AssumeRole", Condition: {StringEquals: {"aws:SourceAccount": !Sub "${AWS::AccountId}"}, ArnLike: {"aws:SourceArn": !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"}}}
      Policies:
        - PolicyName: !Sub "adlc-${LabSuffix}-runtime-role-${AWS::Region}-inline"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: ["logs:DescribeLogStreams", "logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents", "logs:PutResourcePolicy"], Resource: [!Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*", !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*"]}
              - {Effect: Allow, Action: ["logs:DescribeLogGroups"], Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"}
              - {Effect: Allow, Action: ["xray:PutTraceSegments", "xray:PutTelemetryRecords", "xray:GetSamplingRules", "xray:GetSamplingTargets"], Resource: "*"}
              - {Effect: Allow, Action: "cloudwatch:PutMetricData", Resource: "*", Condition: {StringEquals: {"cloudwatch:namespace": bedrock-agentcore}}}
              - {Effect: Allow, Action: ["bedrock:InvokeModel", "bedrock:InvokeModelWithResponseStream"], Resource: [!Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-5-5", !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-5-5", !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-2-lite-v1:0", !Sub "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-5-5", !Sub "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/anthropic.claude-haiku-5-5", !Sub "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/amazon.nova-2-lite-v1:0", !Sub "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-5-5", !Sub "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/anthropic.claude-haiku-5-5", !Sub "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/amazon.nova-2-lite-v1:0", !Sub "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-5-5", !Sub "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/anthropic.claude-haiku-5-5", !Sub "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/amazon.nova-2-lite-v1:0"]}
              - {Effect: Allow, Action: ["bedrock-agentcore:GetWorkloadAccessToken", "bedrock-agentcore:GetWorkloadAccessTokenForJWT", "bedrock-agentcore:GetWorkloadAccessTokenForUserId"], Resource: [!Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default", !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*"]}
