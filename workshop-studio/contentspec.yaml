# AWS Workshop Studio content spec (ContentSpec version 2.0) for the AgentDLC lab:
# Chinese handbook, one AWS account per participant. Choices are explained in workshop-studio/README.md.
version: 2.0
defaultLocaleCode: zh-CN
localeCodes:
  - zh-CN

awsAccountConfig:
  accountSources:
    - workshop_studio
  # No serviceLinkedRoles: the AgentCore Runtime identity and Application Signals roles are created on
  # first use through the instance role (iam:CreateServiceLinkedRole).
  # Participants work on the lab EC2 (its instance role does the lab work). In the console they read
  # CloudWatch / AgentCore / S3 results, open a Session Manager shell on the lab instance, and upload or
  # delete files in their own adlc-* S3 bucket (handbook extension 6).
  participantRole:
    managedPolicies:
      - arn:aws:iam::aws:policy/ReadOnlyAccess
    iamPolicies:
      - static/iam-policy.json
  ec2KeyPair: false
  # Bedrock is enabled in us-west-2 and us-east-1 in event accounts; the lab supports both, us-west-2 first.
  regionConfiguration:
    minAccessibleRegions: 1
    maxAccessibleRegions: 2
    accessibleRegions:
      recommended:
        - us-west-2
      optional:
        - us-east-1
    deployableRegions:
      recommended:
        - us-west-2
      optional:
        - us-east-1

infrastructure:
  cloudformationTemplates:
    # Workshop Studio names the stack after the file: stack "adlc-lab".
    - templateLocation: static/adlc-lab.yaml
      label: AgentDLC lab EC2
      parameters:
        - templateParameter: AssetsBucketName
          defaultValue: "{{.AssetsBucketName}}"
        - templateParameter: AssetsBucketPrefix
          defaultValue: "{{.AssetsBucketPrefix}}"
      participantVisibleStackOutputs:
        - SessionManagerUrl
        - FirstCommand
        - InstanceId
